name: Bootstrap Android project (RUN ONCE)

# 一次性引导工作流：生成 android/ 原生工程供你下载提交
on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate android project
        run: npx cap add android

      - name: Apply fixed build.gradle and app name
        run: |
          python3 - <<'PY'
          import io, json, re, os
          cfg = {}
          if os.path.exists('capacitor.config.json'):
              cfg = json.load(io.open('capacitor.config.json', encoding='utf-8-sig'))
          app_id = cfg.get('appId') or 'com.coffee.notes'
          launcher = '咖啡小记'
          tpl = io.open('android-build.gradle.template', encoding='utf-8').read()
          out = tpl.replace('APP_ID_PLACEHOLDER', app_id)
          assert 'APP_ID_PLACEHOLDER' not in out, 'appId 替换失败'
          assert 'signingConfigs' in out, '模板缺少 signingConfigs'
          io.open('android/app/build.gradle', 'w', encoding='utf-8', newline='').write(out)
          print('build.gradle 已写入, applicationId =', app_id)
          sp = 'android/app/src/main/res/values/strings.xml'
          s = io.open(sp, encoding='utf-8').read()
          s = re.sub(r'<string name="app_name">[^<]*</string>',
                     '<string name="app_name">%s</string>' % launcher, s)
          s = re.sub(r'<string name="title_activity_main">[^<]*</string>',
                     '<string name="title_activity_main">%s</string>' % launcher, s)
          io.open(sp, 'w', encoding='utf-8', newline='').write(s)
          print('桌面应用名已设为', launcher)
          PY

      - name: Show key config
        run: |
          echo "===== android/app/build.gradle ====="
          grep -nE "namespace|applicationId|versionCode|versionName|signingConfig|storeFile" android/app/build.gradle
          echo
          echo "===== strings.xml ====="
          cat android/app/src/main/res/values/strings.xml

      - name: Package android project
        run: |
          tar -czf android-project.tar.gz android
          ls -lh android-project.tar.gz

      - name: Upload android project
        uses: actions/upload-artifact@v4
        with:
          name: android-project
          path: android-project.tar.gz
          retention-days: 30
